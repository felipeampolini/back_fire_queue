services:
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - '9324:9324' # API compatível com SQS
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro # declara as filas e a DLQ

  api:
    build:
      context: .
      target: dev
    command: npm run dev:api
    env_file: .env
    ports:
      - '${API_HOST_PORT:-3000}:3000' # porta no seu computador : porta no container
    volumes:
      - .:/app
    depends_on:
      - elasticmq

  worker:
    build:
      context: .
      target: dev
    command: npm run dev:worker
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - elasticmq
