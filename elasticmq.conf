# Filas locais (emulam o SQS). Em produção, as mesmas filas são criadas na AWS.
include classpath("application.conf")

# Endereço usado nas URLs das filas: "elasticmq" é o nome do serviço no docker-compose
node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Aplica os mesmos limites do SQS real (ex.: mensagem de até 256 KB)
  sqs-limits = strict
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  notifications-queue {
    # Tempo que a mensagem fica invisível para outros consumidores enquanto é processada
    defaultVisibilityTimeout = 30 seconds
    # Long polling: o ReceiveMessage espera até 20s por mensagens antes de retornar vazio
    receiveMessageWait = 20 seconds
    # Após 5 recebimentos sem sucesso, a mensagem vai para a DLQ
    deadLettersQueue {
      name = "notifications-dlq"
      maxReceiveCount = 5
    }
  }

  notifications-dlq {
    # Retenção maior para dar tempo de investigar as falhas
    messageRetentionPeriod = 14 days
  }
}
